name: publish-docker

# Build and publish the cleaner image to GitHub Container Registry (ghcr.io)
# on every commit. Uses the built-in GITHUB_TOKEN, so no extra secrets are
# needed beyond enabling package writes for the repo (Settings → Actions →
# General → Workflow permissions → "Read and write permissions").
#
# Resulting image: ghcr.io/<owner>/<repo>[:tag]
#   - <sha>          : the commit SHA (e.g. ghcr.io/owner/repo:sha-abc123)
#   - <branch>       : the branch name (sanitized)
#   - latest         : only on the repository's default branch
#   - <tag>          : git tags like v1.2.3 (overrides "latest")
#
# Pull requests (including Dependabot's) are build-only: no registry login and
# no push. Their GITHUB_TOKEN is read-only — Dependabot- and fork-triggered runs
# cannot write packages — so attempting to log in would just fail the job.

on:
  push:
    # Dependabot pushes its branches into this repo, which would fire this
    # trigger with a read-only token; those commits are covered by the
    # pull_request trigger below instead.
    branches: ["**", "!dependabot/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  packages: write # required to push to ghcr.io (downgraded to read on PRs)

# Don't let a PR and its branch push (or rapid pushes) build the same ref twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Single source of truth for "this run may write to the registry".
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ env.PUBLISH == 'true' && ' and push' || ' (no push, pull request)' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false