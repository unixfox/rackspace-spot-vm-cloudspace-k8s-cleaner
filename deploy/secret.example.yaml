# Example Secret holding the Rackspace Spot refresh token.
# Copy this to secret.yaml, replace the placeholder with your real refresh
# token (base64-encode it for a Kubernetes Secret), and apply with kubectl.
#
#   echo -n '<your-refresh-token>' | base64 -w0
#
# Then:
#   kubectl apply -f deploy/secret.yaml
#
# Do NOT commit your real token. Keep deploy/secret.yaml out of git
# (it is in .gitignore in this repo's template).
apiVersion: v1
kind: Secret
metadata:
  name: spot-vm-cleaner
  namespace: kube-system
type: Opaque
stringData:
  # stringData avoids manual base64 encoding; kubectl will encode it for you.
  # Replace the placeholder below with your real Rackspace Spot refresh token.
  SPOT_REFRESH_TOKEN: REPLACE_ME_WITH_YOUR_SPOT_REFRESH_TOKEN