name: publish-docker

# Build and publish the cleaner image to GitHub Container Registry (ghcr.io)
# on every commit. Uses the built-in GITHUB_TOKEN, so no extra secrets are
# needed beyond enabling package writes for the repo (Settings → Actions →
# General → Workflow permissions → "Read and write permissions").
#
# Resulting image: ghcr.io/<owner>/<repo>[:tag]
#   - <sha>          : the commit SHA (e.g. ghcr.io/owner/repo:sha-abc123)
#   - <branch>       : the branch name (sanitized)
#   - latest         : only on the repository's default branch
#   - <tag>          : git tags like v1.2.3 (overrides "latest")

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  packages: write # required to push to ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false